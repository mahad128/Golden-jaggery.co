<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" fill="none">
  <title>Golden Jaggery Co.</title>
  <desc>A clean organic sugarcane emblem and Golden Jaggery Co. wordmark.</desc>
  <style>
    .plant { transform-box: fill-box; transform-origin: center bottom; animation: gentle-sway 4s ease-in-out infinite; }
    .glint { animation: soft-glint 3.2s ease-in-out infinite; }
    @keyframes gentle-sway {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-3deg); }
    }
    @keyframes soft-glint {
      0%, 100% { opacity: .35; }
      50% { opacity: .9; }
    }
    @media (prefers-reduced-motion: reduce) {
      .plant, .glint { animation: none; }
    }
  </style>

  <g>
    <circle cx="170" cy="180" r="137" fill="#4A6B2A"/>
    <circle cx="170" cy="180" r="124" stroke="#FAF0E6" stroke-width="2"/>
    <g class="plant">
      <path d="M168 254V115" stroke="#FAF0E6" stroke-width="8" stroke-linecap="round"/>
      <path d="M168 184C133 170 114 147 111 116C142 122 163 141 174 169" fill="#C8922E"/>
      <path d="M170 158C190 124 220 107 254 110C239 144 213 164 178 174" fill="#A3AD85"/>
      <path d="M168 216C135 204 117 184 112 158C143 164 164 181 174 204" fill="#C8922E"/>
      <path d="M168 184L113 117M174 169L249 113M170 214L115 160" stroke="#4A6B2A" stroke-width="4" stroke-linecap="round"/>
      <path d="M168 139V151M168 178V190M168 207V219" stroke="#4A6B2A" stroke-width="5" stroke-linecap="round"/>
    </g>
    <circle class="glint" cx="265" cy="95" r="5" fill="#C8922E"/>
    <path d="M265 82V88M265 102V108M252 95H258M272 95H278" stroke="#C8922E" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text x="360" y="112" fill="#4A6B2A" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" letter-spacing="8">GOLDEN</text>
  <text x="356" y="198" fill="#1E1E1E" font-family="Georgia, 'Times New Roman', serif" font-size="75" font-weight="700" letter-spacing="1">JAGGERY CO.</text>
  <path d="M360 229H1004" stroke="#C8922E" stroke-width="3"/>
  <text x="360" y="276" fill="#5E5E52" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" letter-spacing="5">PURE · DESI · NATURAL</text>
</svg>
